name: Tracked File Privacy Guard

on:
  push:
    paths:
      - ".github/workflows/tracked-file-privacy-guard.yml"
      - "AGENTS.md"
      - "docs/**"
      - "schemas/privacy-guard/**"
      - "crates/**"
      - "*.toml"
      - "*.md"
  pull_request:
    paths:
      - ".github/workflows/tracked-file-privacy-guard.yml"
      - "AGENTS.md"
      - "docs/**"
      - "schemas/privacy-guard/**"
      - "crates/**"
      - "*.toml"
      - "*.md"

jobs:
  tracked-file-privacy-guard:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout tooling
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/p2p-overlord-tooling
          path: .ci/p2p-overlord-tooling

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run tracked-file privacy guard
        shell: pwsh
        working-directory: .ci/p2p-overlord-tooling
        run: python -m overlord_tooling guard-tracked-files --repo-root ../..
